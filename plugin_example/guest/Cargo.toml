[package]
name = "legion-hello"
version = "0.1.0"
edition = "2021"
publish = false

# cdylib 才会产出带自定义导出的 .wasm；普通 lib 不会。
[lib]
crate-type = ["cdylib"]

[dependencies]
# SDK 承担 ABI：四个导出、op 分发、内存管理、指针打包、JSON 与 op 0 的自述。
legion-plugin = { path = "../../sdk/rust/legion-plugin" }

# 每个 feature 透传给 SDK。打开一个就是让最终模块多 import 一个 host 函数，
# 而 import 一个部署没授权的函数会让模块在**实例化**时失败（能力是链接期事实）。
# 所以打开 feature 必须三处联动：这里、scripts/build.sh 内联 plugin.json 的
# capabilities、以及部署侧 grant 的 --capabilities。
[features]
default = []
config-capability = ["legion-plugin/config-capability"]
kv-capability = ["legion-plugin/kv-capability"]
http-capability = ["legion-plugin/http-capability"]
fs-capability = ["legion-plugin/fs-capability"]
tool-capability = ["legion-plugin/tool-capability"]

[profile.release]
opt-level = "z"
lto = true
strip = true
# panic 不能从 plugin_invoke 越过 FFI 边界向外展开。abort 会把 bug 变成一个宿主
# 能报告的 wasm trap，而不是跨边界的未定义行为。
panic = "abort"
