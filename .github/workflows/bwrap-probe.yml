name: bwrap probe
on:
  push:
    branches: [feat/linux-bwrap-sandbox]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: which bwrap || echo "NO BWRAP"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - run: bwrap --version
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --die-with-parent -- /bin/echo "bwrap works" || echo "BWRAP FAILED rc=$?"
      - run: sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "(no apparmor knob)"
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "(cannot relax)"
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --die-with-parent -- /bin/echo "bwrap works after relaxing" || echo "STILL FAILED rc=$?"
      - run: |
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user-try --unshare-pid --die-with-parent -- /bin/echo "try-variant works" || echo "TRY VARIANT FAILED rc=$?"
