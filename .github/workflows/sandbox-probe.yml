name: Sandbox Probe

# 手动触发的**探针**，不进常规 CI：它回答的是「这个平台上这层沙箱做不做得成」，
# 而不是「代码有没有坏」。上一次在 Linux 上把 bubblewrap 一路写完才发现 runner
# 起不来，返工四轮；这次先花一次 CI 把事实问清楚。
on:
  workflow_dispatch:
  # 也挂在 PR 上：workflow_dispatch 只认默认分支上已存在的工作流，而这个探针的
  # 全部意义就是在它自己那条分支上先跑一次。路径过滤保证它只为探针本身而跑。
  pull_request:
    paths:
      - ".github/workflows/sandbox-probe.yml"
      - "internal/browser/sandbox_darwin_probe_test.go"

jobs:
  macos-probe:
    name: macOS sandbox-exec + orphan probe
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Probe
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        # -v 是重点：探针的产出是日志里那张表，不是退出码。
        run: go test -tags sandboxprobe ./internal/browser/ -run TestProbe -v -count=1 -timeout 15m
